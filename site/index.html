<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>バーナム効果のるつぼ1997</title>
<style>
@font-face { font-family:"DeterminationJP"; src:url("fonts/DeterminationJP.ttf") format("truetype"); font-display:swap; }
@font-face { font-family:"MonsterFriendFore"; src:url("fonts/MonsterFriendFore.otf") format("opentype"); font-display:swap; }
* { box-sizing:border-box; }
body { margin:0; background:#000; color:#fff; text-align:center;
  font-family:"DeterminationJP","MS PGothic",Osaka,sans-serif; }
h1 { font-weight:normal; }
.site-header { position:sticky; top:0; z-index:100; background:#000; color:#fff; border-bottom:1px solid #fff; text-align:left; }
.header-logo { font-family:"MonsterFriendFore","DeterminationJP","MS PGothic",sans-serif;
  color:#fff; font-size:20px; padding:8px 14px; letter-spacing:2px; }
.header-logo .dotcom { opacity:.55; }
.index-main { max-width:640px; margin:0 auto; padding:60px 16px 80px; }
.index-title { font-family:"MonsterFriendFore","DeterminationJP","MS PGothic",sans-serif;
  color:#ffe600; font-size:34px; margin:0 0 8px; line-height:1.3; }
.index-sub { color:#fff; font-size:15px; margin:0 0 40px; }
.tape { height:14px; margin:0 auto 40px; max-width:420px;
  background:repeating-linear-gradient(-45deg, #ffe600 0 14px, #000 14px 28px); border:1px solid #ffe600; }
/* 透過PNGをそのまま置く（背景・枠は付けない）．重機が動いている感じに小刻みに上下させる */
.uc-img { display:block; margin:0 auto 36px; max-width:100%; height:auto; image-rendering:pixelated;
  animation:ucbob .42s steps(1) infinite; }
@keyframes ucbob {
  0%   { transform:translateY(0); }
  25%  { transform:translateY(-3px); }
  50%  { transform:translateY(1px); }
  75%  { transform:translateY(-2px); }
  100% { transform:translateY(0); }
}
@media (prefers-reduced-motion: reduce) { .uc-img { animation:none; } }
.uc-msg { font-size:15px; line-height:2; margin:0 0 6px; color:#fff; }
.uc-blink { color:#ffe600; font-size:13px; letter-spacing:3px; margin-top:34px; animation:ucblink 1.2s steps(1) infinite; }
@keyframes ucblink { 50% { opacity:.25; } }
.site-footer { text-align:center; font-size:12px; padding:24px 0; color:#888; }
</style>
</head>
<body class="index-page under-construction">
<header class="site-header">
  <div class="header-logo">バーナム効果のるつぼ1997<span class="dotcom">.com</span></div>
</header>
<main class="index-main">
  <h1 class="index-title">工事中</h1>
  <p class="index-sub">Deltaruneの感想・考察・妄想の吹き溜まり</p>
  <div class="tape"></div>
  <img class="uc-img" src="resource/Sans_battle_bulldozer.gif" alt="工事中" style="width:264px">
  <p class="uc-msg">＊おっと！　ここから先は未体験ゾーンだぜ</p>
  <p class="uc-msg">＊ソースファイルなんかみても　なんもないぞ。</p>
<p class="uc-msg">＊ケチャップならあるかもしれないがな。</p>
  <p class="uc-blink">UNDER CONSTRUCTION</p>
</main>
<footer class="site-footer">バーナム効果のるつぼ1997 / 1997</footer>
</body></html>
